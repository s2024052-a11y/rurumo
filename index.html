<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RURUMO</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#24324a;background:#f3f7ff}
*{box-sizing:border-box}body{margin:0}.app{max-width:760px;margin:auto;padding:18px}
header{padding:12px 4px 18px}h1{margin:0;color:#536fca;letter-spacing:2px}small,.muted{color:#71809b}
.panel{background:white;border:1px solid #e2eafa;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 4px 18px #536fca0d}
#map{height:340px;border-radius:14px;background:#edf2fa}
button,select{border:0;border-radius:12px;padding:12px 16px;background:#617bd5;color:white;font-size:15px;margin:4px}
button.secondary{background:#e9efff;color:#405cae}button:disabled{opacity:.5}
input{padding:12px;border:1px solid #d8e1f3;border-radius:10px;width:100%;margin:6px 0}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.status{font-size:14px;line-height:1.6;white-space:pre-wrap}
.item{padding:12px 0;border-top:1px solid #edf1f8}.tabs{display:flex;gap:6px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="app">
<header><h1>RURUMO</h1><small>歩いた場所を、思い出の地図に。</small></header>
<section class="panel">
<strong>アカウント</strong>
<p id="authStatus" class="status">接続確認中...</p>
<div class="row"><input id="nickname" placeholder="ニックネーム（任意）"><button id="saveName">名前を保存</button></div>
</section>
<section class="panel">
<div class="row"><strong>地図</strong><span class="muted">GPSルートは初期設定で非公開</span></div>
<div id="map"></div>
<p id="gpsStatus" class="status">GPS記録は停止中です。</p>
<div class="row">
<button id="start">記録開始</button><button id="finish" class="secondary" disabled>記録終了・保存</button>
<button id="locate" class="secondary">現在地へ移動</button>
</div>
</section>
<section class="panel">
<strong>保存したルート</strong>
<p class="muted">この端末の既存データは消さず、サーバー上の自分の非公開ルートを読み込みます。</p>
<button id="reload" class="secondary">サーバーから再読み込み</button>
<div id="routes"></div>
</section>
<section class="panel">
<strong>機能の進捗</strong>
<p class="status">実装済み：匿名ログイン、ニックネーム保存、GPS記録、非公開ルートの保存・読み込み（この版の範囲）</p>
<p class="status">未実装：グループ共有、チャット、写真投稿、世界地図の集計、アカウント引き継ぎ</p>
</section>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  const SUPABASE_URL = 'https://rbzityloywzrtisnhttj.supabase.co';
  // Supabaseの sb_publishable_ で始まる公開キーをここに設定してください。
  const SUPABASE_PUBLISHABLE_KEY = 'ここにsb_publishable_キーを貼り付け';
  const $ = id => document.getElementById(id);
  const localKey = 'rurumo_v1_data';
  let db, user, watchId = null, points = [], line = null;
  let map;

  function localData(){
    try { return JSON.parse(localStorage.getItem(localKey) || '{"routes":[]}'); }
    catch { return {routes:[]}; }
  }
  function saveLocalRoute(route){
    const data = localData();
    data.routes = data.routes || [];
    data.routes.push(route);
    localStorage.setItem(localKey, JSON.stringify(data));
  }
  function status(message){ $('gpsStatus').textContent = message; }

  async function init(){
    map = L.map('map').setView([37.95,139.33], 9);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      attribution:'&copy; OpenStreetMap contributors'
    }).addTo(map);
    if (SUPABASE_PUBLISHABLE_KEY.startsWith('ここに')) {
      $('authStatus').textContent = 'Supabase公開キーを設定してください。';
      return;
    }
    try {
      db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
      let result = await db.auth.getSession();
      if (result.error) throw result.error;
      if (!result.data.session) {
        result = await db.auth.signInAnonymously();
        if (result.error) throw result.error;
      }
      user = (await db.auth.getUser()).data.user;
      if (!user) throw new Error('ユーザー情報を取得できませんでした');
      $('authStatus').textContent = 'ログイン済み（匿名アカウント）';
      await loadProfile();
      await loadRoutes();
    } catch(e) {
      $('authStatus').textContent = '接続エラー：' + e.message;
    }
  }

  async function loadProfile(){
    const {data,error} = await db.from('profiles').select('username').eq('id',user.id).maybeSingle();
    if(error) throw error;
    if(data?.username) $('nickname').value = data.username;
  }

  $('saveName').onclick = async () => {
    if(!db || !user) return alert('ログインできていません。');
    const username = $('nickname').value.trim();
    if(!username) return alert('ニックネームを入力してください。');
    const {error} = await db.from('profiles').upsert({id:user.id,username},{onConflict:'id'});
    if(error) alert('保存できませんでした：'+error.message);
    else $('authStatus').textContent = 'ログイン済み・ニックネーム保存済み';
  };

  async function loadRoutes(){
    if(!db || !user) return;
    $('routes').textContent = '読み込み中...';
    const {data,error} = await db.from('routes')
      .select('id,route_data,created_at')
      .eq('user_id',user.id).eq('visibility','private')
      .order('created_at',{ascending:false}).limit(50);
    if(error){ $('routes').textContent='読み込みエラー：'+error.message; return; }
    $('routes').innerHTML = '';
    if(!data.length){ $('routes').textContent='サーバー上にルートはまだありません。'; return; }
    data.forEach(r => {
      const pts = r.route_data?.points || [];
      const d = Number(r.route_data?.distance || 0);
      const div=document.createElement('div'); div.className='item';
      const date=new Date(r.created_at).toLocaleString('ja-JP');
      div.textContent = `${date} ／ ${(d/1000).toFixed(2)} km ／ ${pts.length}地点`;
      $('routes').appendChild(div);
    });
  }
  $('reload').onclick = loadRoutes;

  function drawCurrent(){
    if(line) map.removeLayer(line);
    if(points.length) {
      line=L.polyline(points.map(p=>[p.lat,p.lng]),{color:'#617bd5',weight:5}).addTo(map);
    }
  }
  $('start').onclick = () => {
    if(!navigator.geolocation) return status('このブラウザではGPSを利用できません。');
    if(watchId!==null) return;
    points=[];
    status('GPS記録中です。移動すると位置が記録されます。');
    $('start').disabled=true; $('finish').disabled=false;
    watchId=navigator.geolocation.watchPosition(pos=>{
      const p={lat:pos.coords.latitude,lng:pos.coords.longitude,time:new Date().toISOString()};
      points.push(p); drawCurrent();
      map.setView([p.lat,p.lng],15);
      status(`GPS記録中：${points.length}地点`);
    },err=>{
      status('GPSエラー：'+err.message+'。位置情報の利用を許可してください。');
    },{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
  };

  $('finish').onclick = async () => {
    if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null;}
    $('start').disabled=false; $('finish').disabled=true;
    if(points.length<2){status('地点が少ないため、ルートは保存しませんでした。');return;}
    let distance=0;
    for(let i=1;i<points.length;i++){
      distance += map.distance([points[i-1].lat,points[i-1].lng],[points[i].lat,points[i].lng]);
    }
    const route={id:crypto.randomUUID(),points:[...points],distance,created_at:new Date().toISOString()};
    saveLocalRoute(route); // 端末側にも保存し、サーバー失敗時も残す
    if(!db || !user){status('端末には保存しました。サーバー未接続のため同期できません。');return;}
    const {error}=await db.from('routes').insert({
      id:route.id,user_id:user.id,route_data:{points:route.points,distance:route.distance},
      visibility:'private',created_at:route.created_at,group_id:null
    });
    if(error){status('端末には保存しましたが、サーバー同期に失敗：'+error.message);return;}
    status('ルートを端末とSupabaseに非公開で保存しました。');
    await loadRoutes();
  };

  $('locate').onclick=()=>{
    if(!navigator.geolocation) return status('GPSを利用できません。');
    navigator.geolocation.getCurrentPosition(pos=>{
      map.setView([pos.coords.latitude,pos.coords.longitude],15);
    },err=>status('現在地を取得できません：'+err.message),{enableHighAccuracy:true});
  };
  init();
})();
</script>
</body>
</html>
